<!DOCTYPE html>
<html lang="fa" dir="rtl" id="mainHtml">
<head>

        \"start_url\": \".\",
        \"display\": \"standalone\",
        \"theme_color\": \"#0a0c12\",
        \"background_color\": \"#0a0c12\",
        \"icons\": [

    <meta name="mobile-web-app-capable" content="yes">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; transition: background 0.3s, color 0.2s, border-color 0.2s; }
        
        :root {
            --bg-body: linear-gradient(135deg, #0a0c12 0%, #0f1420 100%);
            --bg-card: rgba(18,22,35,0.9);
            --text-primary: #f0f3fa;
            --text-secondary: #8e9aaf;
            --border-color: rgba(255,255,255,0.1);
            --border-light: #2a2f3f;
            --positive: #2ed573;
            --negative: #ff6b6b;
            --neutral: #f6b93b;
            --tab-bg: rgba(30,36,56,0.8);
            --tab-active: linear-gradient(135deg, #f6b93b, #fda085);
            --filter-bg: rgba(18,22,35,0.8);
            --stats-bg: rgba(18,22,35,0.6);
            --modal-bg: #11161f;
            --chart-bg: #0a0e16;
            --market-card-bg: rgba(18,22,35,0.95);
            --suggestion-bg: linear-gradient(135deg, #1a1f2e, #0f1420);
            --btn-bg: #f6b93b;
            --btn-color: #0a0c12;
        }
        
        body.light {
            --bg-body: linear-gradient(135deg, #f0f2f5 0%, #e0e4e8 100%);
            --bg-card: rgba(255,255,255,0.95);
            --text-primary: #1a1a2e;
            --text-secondary: #6c7a91;
            --border-color: rgba(0,0,0,0.1);
            --border-light: #d0d5db;
            --positive: #2ed573;
            --negative: #ff6b6b;
            --neutral: #f6b93b;
            --tab-bg: rgba(230,235,245,0.9);
            --tab-active: linear-gradient(135deg, #f6b93b, #fda085);
            --filter-bg: rgba(240,242,245,0.9);
            --stats-bg: rgba(230,235,245,0.8);
            --modal-bg: #ffffff;
            --chart-bg: #f0f2f5;
            --market-card-bg: rgba(255,255,255,0.95);
            --suggestion-bg: linear-gradient(135deg, #e8ecf2, #dfe3e9);
            --btn-bg: #f6b93b;
            --btn-color: #1a1a2e;
        }
        
        body { background: var(--bg-body); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: var(--text-primary); min-height: 100vh; }
        .main-tabs { background: rgba(10,12,18,0.95); backdrop-filter: blur(10px); padding: 0.6rem 1rem; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; }
        body.light .main-tabs { background: rgba(255,255,255,0.95); }
        .tabs-container { max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
        .logo { display: flex; align-items: center; gap: 0.5rem; }
        .logo h1 { font-size: 1.2rem; background: linear-gradient(135deg, #f6d365, #fda085); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .tabs { display: flex; gap: 0.3rem; flex-wrap: wrap; }
        .tab-btn { padding: 0.35rem 0.6rem; border: none; background: var(--tab-bg); color: var(--text-secondary); font-size: 0.65rem; font-weight: 600; border-radius: 2rem; cursor: pointer; transition: all 0.3s; }
        .tab-btn.active { background: var(--tab-active); color: #0a0c12; }
        .link-btn { padding: 0.35rem 0.6rem; background: var(--tab-bg); color: var(--text-secondary); font-size: 0.65rem; font-weight: 600; border-radius: 2rem; text-decoration: none; display: inline-block; transition: all 0.3s; }
        .link-btn:hover { background: var(--tab-active); color: #0a0c12; }
        .theme-btn { background: var(--tab-bg); color: var(--text-secondary); border: none; padding: 0.35rem 0.6rem; border-radius: 2rem; font-size: 0.65rem; cursor: pointer; transition: all 0.3s; }
        .theme-btn:hover { background: var(--tab-active); color: #0a0c12; }
        .lang-btn { background: var(--tab-bg); color: var(--text-secondary); border: none; padding: 0.35rem 0.6rem; border-radius: 2rem; font-size: 0.65rem; cursor: pointer; transition: all 0.3s; }
        .lang-btn:hover { background: var(--tab-active); color: #0a0c12; }
        .filter-bar { background: var(--filter-bg); padding: 0.5rem 1rem; border-bottom: 1px solid var(--border-color); }
        .filter-container { max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
        .filter-group { display: flex; gap: 0.3rem; flex-wrap: wrap; }
        .filter-btn { background: #1e2438; border: none; padding: 0.25rem 0.6rem; border-radius: 2rem; color: var(--text-secondary); cursor: pointer; font-size: 0.65rem; transition: all 0.2s; }
        body.light .filter-btn { background: #e0e4e8; color: #1a1a2e; }
        .filter-btn.active { background: #3498db; color: white; }

        .search-box input { background: transparent; border: none; color: var(--text-primary); padding: 0.2rem; outline: none; width: 130px; font-size: 0.7rem; }
        .stats-bar { background: var(--stats-bg); margin: 0.5rem 1rem; padding: 0.4rem 0.5rem; border-radius: 0.8rem; display: flex; justify-content: space-around; flex-wrap: wrap; gap: 0.5rem; }
        .stat-item { text-align: center; cursor: pointer; transition: all 0.2s; padding: 0.2rem 0.4rem; border-radius: 0.5rem; }
        .stat-item:hover { background: rgba(246,185,59,0.2); }
        .stat-label { font-size: 0.55rem; color: var(--text-secondary); }
        .stat-value { font-size: 0.85rem; font-weight: bold; }
        .positive { color: var(--positive); }
        .negative { color: var(--negative); }
        .neutral { color: var(--neutral); }
        .container { max-width: 1400px; margin: 0 auto; padding: 0.5rem 1rem 1rem; }
        
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 0.7rem; margin-top: 0.5rem; }
        .card { background: var(--bg-card); border-radius: 0.9rem; padding: 0.7rem; border: 1px solid var(--border-color); transition: all 0.3s; cursor: pointer; }
        .card:hover { transform: translateY(-2px); border-color: #f6b93b; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.3rem; }
        .item-info { display: flex; align-items: center; gap: 0.4rem; }
        .item-icon { width: 32px; height: 32px; background: #1f2a3e; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; }
        .price { font-size: 0.85rem; font-weight: bold; }
        .change { font-size: 0.6rem; margin-top: 0.05rem; }
        .chart-container { height: 80px; margin: 0.3rem 0; position: relative; }
        .chart-container canvas { width: 100% !important; height: 100% !important; }
        .details { margin-top: 0.3rem; padding-top: 0.3rem; border-top: 1px solid var(--border-color); display: flex; justify-content: space-between; font-size: 0.5rem; flex-wrap: wrap; gap: 0.2rem; }
        .prediction { margin-top: 0.3rem; padding: 0.2rem; background: rgba(0,0,0,0.3); border-radius: 0.5rem; text-align: center; font-size: 0.55rem; }
        .footer { text-align: center; padding: 0.6rem; color: var(--text-secondary); border-top: 1px solid var(--border-color); margin-top: 0.8rem; font-size: 0.6rem; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: var(--modal-bg); border-radius: 0.9rem; padding: 0.8rem; max-width: 750px; width: 90%; max-height: 90vh; overflow-y: auto; border: 1px solid #f6b93b; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
        .close-modal { background: none; border: none; color: var(--text-primary); font-size: 1.1rem; cursor: pointer; }
        .modal-chart-container { height: 200px; margin: 0.5rem 0; }
        .modal-chart-container canvas { width: 100% !important; height: 100% !important; }
        .modal-volume-container { height: 70px; margin: 0.5rem 0; }
        .modal-volume-container canvas { width: 100% !important; height: 100% !important; }
        .modal-rsi-container { height: 80px; margin: 0.5rem 0; }
        .modal-rsi-container canvas { width: 100% !important; height: 100% !important; }
        .modal-macd-container { height: 80px; margin: 0.5rem 0; }
        .modal-macd-container canvas { width: 100% !important; height: 100% !important; }
        
        .markets-overview { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 0.8rem; margin-top: 0.5rem; }
        .market-card { background: var(--market-card-bg); border-radius: 0.9rem; padding: 0.7rem; border: 1px solid var(--border-color); cursor: pointer; transition: all 0.2s; }
        .market-card:hover { transform: translateY(-2px); border-color: #f6b93b; }
        .market-header { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.5rem; padding-bottom: 0.3rem; border-bottom: 1px solid var(--border-color); }
        .market-icon { font-size: 1.2rem; }
        .market-title { font-size: 0.85rem; font-weight: bold; }
        .market-stats { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.3rem; margin-bottom: 0.5rem; }
        .market-stat { text-align: center; flex: 1; min-width: 45px; background: rgba(0,0,0,0.3); border-radius: 0.4rem; padding: 0.25rem; }
        .market-stat-label { font-size: 0.45rem; color: var(--text-secondary); }
        .market-stat-value { font-size: 0.75rem; font-weight: bold; }
        .market-progress { background: #1e2438; border-radius: 0.5rem; height: 8px; overflow: hidden; margin: 0.25rem 0; }
        .market-progress-fill { height: 100%; border-radius: 0.5rem; transition: width 0.3s; }
        .market-analysis { font-size: 0.5rem; text-align: center; margin-top: 0.3rem; padding: 0.2rem; background: rgba(52,152,219,0.1); border-radius: 0.35rem; }
        
        .suggestion-card { background: var(--suggestion-bg); border-radius: 0.8rem; padding: 0.6rem; margin: 0.5rem 0; text-align: center; border-right: 4px solid; }
        .suggestion-buy { border-right-color: var(--positive); }
        .suggestion-sell { border-right-color: var(--negative); }
        .suggestion-hold { border-right-color: var(--neutral); }
        .suggestion-title { font-size: 0.7rem; font-weight: bold; margin-bottom: 0.2rem; }
        .suggestion-reason { font-size: 0.55rem; color: var(--text-secondary); }
        
        .install-btn { background: var(--btn-bg); color: var(--btn-color); border: none; padding: 0.3rem 0.8rem; border-radius: 1.5rem; font-size: 0.7rem; font-weight: bold; cursor: pointer; margin-left: 0.5rem; transition: all 0.2s; }
        .install-btn:hover { background: #fda085; transform: scale(1.02); }
        .live-badge { background: #ff4444; color: white; font-size: 0.6rem; padding: 0.2rem 0.5rem; border-radius: 1rem; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
        @media (max-width: 768px) { .tabs-container, .filter-container { flex-direction: column; } .container { padding: 0.5rem; } .tab-btn { padding: 0.25rem 0.5rem; font-size: 0.6rem; } }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<div class="main-tabs">

        <div class="tabs">

            <button class="tab-btn" data-market="currency" id="tabCurrency">💱 ارز (20)</button>

    </div>
</div>

<div class="filter-bar" id="filterBar" style="display:none">

</div>

<div class="stats-bar" id="statsBar"></div>

<div class="container">

</div>

<div id="modal" class="modal">
    <div class="modal-content">
        <div class="modal-header"><h3 id="modalTitle">اطلاعات</h3><button class="close-modal" onclick="closeModal()">✕</button></div>
        <div id="modalBody"></div>
        <div id="suggestionBox" class="suggestion-card"></div>
        <div class="modal-chart-container"><canvas id="modalLineChart"></canvas></div>
        <div class="modal-volume-container"><canvas id="modalVolumeChart"></canvas></div>
        <div class="modal-rsi-container"><canvas id="modalRSIChart"></canvas></div>
        <div class="modal-macd-container"><canvas id="modalMACDChart"></canvas></div>

</div>

        <div id="analysisBody"></div>

</div>

<script>
    // ==================== دیکشنری چند زبانه ====================

    let currentMarket = "overview";

    let searchText = "";

    let chartInstances = {};

    // ==================== کلیدهای API ====================
    const EXCHANGE_RATE_API_KEY = '92b9c91ea5d8d0a4d730b332';
    const ZIPODO_API_URL = 'https://api.zipodo.ir/usdt/';
    const EXCHANGE_API_URL = `https://v6.exchangerate-api.com/v6/${EXCHANGE_RATE_API_KEY}/latest/USD`;

    // ==================== توابع ====================
    function getText(key) {
        const keys = key.split('.');
        let result = translations[currentLang];
        for (const k of keys) {
            if (result && result[k] !== undefined) result = result[k];
            else return key;
        }
        return result;
    }

    function updateLanguage() {
        document.getElementById('appTitle').innerHTML = getText('appTitle') + ' <span id="statusBadge" class="live-badge">' + getText('live') + '</span>';
        document.getElementById('footerText').textContent = getText('footer');
        document.getElementById('analysisTitle').textContent = getText('analysisTitle');
        document.getElementById('modalTitle').textContent = getText('modalTitle');
        document.getElementById('themeBtn').textContent = getText('theme');
        document.getElementById('langBtn').textContent = getText('lang');
        document.getElementById('installAppBtn').textContent = getText('install');
        document.getElementById('searchInput').placeholder = getText('search');
        document.getElementById('linkTerminal').textContent = getText('tabs.terminal');
        
        document.querySelectorAll('.tab-btn').forEach(btn => {
            const market = btn.getAttribute('data-market');
            if (market && getText('tabs')[market]) {
                btn.textContent = getText('tabs')[market];
            }
        });
        
        document.getElementById('filterAll').textContent = getText('filters.all');
        document.getElementById('filterGainers').textContent = getText('filters.gainers');
        document.getElementById('filterLosers').textContent = getText('filters.losers');
        
        localStorage.setItem('marketLang', currentLang);
        renderCards();
        updateStatsBar();
    }

    const stockNames = {
        fa: {

    function formatPrice(price) {
        price = Math.round(price);
        if(price < 1) return price.toFixed(4);
        if(price < 10) return price.toFixed(3);
        if(price < 1000) return price.toFixed(2);
        return price.toLocaleString();
    }

    function getPredictionText(pred) {
        if(pred > 1.5) {
            if(currentLang === 'en') return "📈 Strong Up (+" + pred.toFixed(1) + "%)";
            return "📈 صعود قوی (+" + pred.toFixed(1) + "%)";
        }
        if(pred > 0.5) {
            if(currentLang === 'en') return "📈 Mild Up (+" + pred.toFixed(1) + "%)";
            return "📈 صعود ملایم (+" + pred.toFixed(1) + "%)";
        }
        if(pred < -1.5) {
            if(currentLang === 'en') return "📉 Strong Down (" + pred.toFixed(1) + "%)";
            return "📉 نزول شدید (" + pred.toFixed(1) + "%)";
        }
        if(pred < -0.5) {
            if(currentLang === 'en') return "📉 Mild Down (" + pred.toFixed(1) + "%)";
            return "📉 نزول ملایم (" + pred.toFixed(1) + "%)";
        }
        if(currentLang === 'en') return "➖ Neutral (" + (pred > 0 ? '+' : '') + pred.toFixed(1) + "%)";
        return "➖ نوسان (" + (pred > 0 ? '+' : '') + pred.toFixed(1) + "%)";
    }

    function generatePriceData(item, days = 60) {
        const seed = item.symbol.split('').reduce((acc, ch) => acc + ch.charCodeAt(0), 0);
        let state = seed;
        function random() {
            state = (state * 9301 + 49297) % 233280;
            return state / 233280;
        }
        
        const basePrice = item.price * 0.85;
        const dates = [];
        const prices = [];
        const volumes = [];
        
        let price = basePrice;
        const now = new Date();
        const changeFactor = item.change / 100;
        
        for (let i = days; i >= 0; i--) {
            const date = new Date(now);
            date.setDate(date.getDate() - i);
            if (date.getDay() === 0 || date.getDay() === 6) continue;
            
            const ch = (random() - 0.45) * 0.035 + changeFactor * 0.25;
            price = Math.max(price * (1 + ch), 1);
            
            dates.push(date.toISOString().split('T')[0]);
            prices.push(price);
            volumes.push(Math.floor(random() * 10000000 + 100000));
        }
        return { dates, prices, volumes };
    }

    function calculateRSI(prices, period = 14) {
        const rsi = [];
        for (let i = period; i < prices.length; i++) {
            let gain = 0, loss = 0;
            for (let j = i - period + 1; j <= i; j++) {
                const diff = prices[j] - prices[j-1];
                if (diff >= 0) gain += diff;
                else loss += Math.abs(diff);
            }
            const avgGain = gain / period;
            const avgLoss = loss / period;
            const rs = avgLoss === 0 ? 100 : avgGain / avgLoss;
            rsi.push(100 - (100 / (1 + rs)));
        }
        return rsi;
    }

    function renderCardChart(canvasId, item) {
        const ctx = document.getElementById(canvasId);
        if (!ctx) return;
        
        if (chartInstances[canvasId]) {
            chartInstances[canvasId].destroy();
            delete chartInstances[canvasId];
        }
        
        const data = generatePriceData(item, 40);
        if (data.dates.length < 5) return;
        
        const color = item.change >= 0 ? '#2ed573' : '#ff6b6b';
        const gradient = ctx.getContext('2d').createLinearGradient(0, 0, 0, 80);
        gradient.addColorStop(0, color + '40');
        gradient.addColorStop(1, color + '00');
        
        try {
            const chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.dates,
                    datasets: [{
                        label: 'قیمت',
                        data: data.prices,
                        borderColor: color,
                        backgroundColor: gradient,
                        borderWidth: 2,
                        fill: true,
                        tension: 0.3,
                        pointRadius: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: { enabled: false }
                    },
                    scales: {
                        x: { display: false, grid: { display: false } },
                        y: { display: false, grid: { display: false } }
                    }
                }
            });
            chartInstances[canvasId] = chart;
        } catch(e) {}
    }

    // ==================== نمودارهای کامل مودال با تمام اندیکاتورها ====================
    function renderModalCharts(item) {
        const data = generatePriceData(item, 60);
        if (data.dates.length < 5) return;
        
        const color = item.change >= 0 ? '#2ed573' : '#ff6b6b';
        
        // ---- محاسبه اندیکاتورها ----
        const sma20 = [];
        const sma50 = [];
        for (let i = 0; i < data.prices.length; i++) {
            if (i < 19) { sma20.push(null); } else {
                let sum = 0;
                for (let j = i - 19; j <= i; j++) sum += data.prices[j];
                sma20.push(sum / 20);
            }
            if (i < 49) { sma50.push(null); } else {
                let sum = 0;
                for (let j = i - 49; j <= i; j++) sum += data.prices[j];
                sma50.push(sum / 50);
            }
        }
        
        const bbUpper = [];
        const bbLower = [];
        for (let i = 0; i < data.prices.length; i++) {
            if (i < 19) { bbUpper.push(null); bbLower.push(null); continue; }
            let sum = 0;
            for (let j = i - 19; j <= i; j++) sum += data.prices[j];
            const mean = sum / 20;
            let sqSum = 0;
            for (let j = i - 19; j <= i; j++) sqSum += Math.pow(data.prices[j] - mean, 2);
            const std = Math.sqrt(sqSum / 20);
            bbUpper.push(mean + 2 * std);
            bbLower.push(mean - 2 * std);
        }
        
        const ema12 = [], ema26 = [], macdLine = [], signalLine = [], macdHist = [];
        for (let i = 0; i < data.prices.length; i++) {
            if (i === 0) {
                ema12.push(data.prices[i]);
                ema26.push(data.prices[i]);
                macdLine.push(0);
                signalLine.push(0);
                macdHist.push(0);
                continue;
            }
            const ema12Val = data.prices[i] * (2/13) + ema12[i-1] * (11/13);
            const ema26Val = data.prices[i] * (2/27) + ema26[i-1] * (25/27);
            ema12.push(ema12Val);
            ema26.push(ema26Val);
            const macd = ema12Val - ema26Val;
            macdLine.push(macd);
            if (i === 1) {
                signalLine.push(macd);
            } else {
                const signal = macd * (2/10) + signalLine[i-1] * (8/10);
                signalLine.push(signal);
            }
            macdHist.push(macdLine[i] - signalLine[i]);
        }
        
        // ===== ۱. نمودار قیمت با SMA و بولینگر =====
        const lineCtx = document.getElementById('modalLineChart');
        if (modalCharts.line) { modalCharts.line.destroy(); }
        
        const gradient = lineCtx.getContext('2d').createLinearGradient(0, 0, 0, 200);

                    }
                }
            }
        });
        
        // ===== ۲. نمودار حجم =====
        const volCtx = document.getElementById('modalVolumeChart');
        if (modalCharts.volume) { modalCharts.volume.destroy(); }
        
        const volColors = data.prices.map((p, i) => {
            if (i === 0) return '#8e9aaf';

        });
        
        modalCharts.volume = new Chart(volCtx, {
            type: 'bar',

                datasets: [{

                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return 'حجم: ' + (context.parsed.y / 1000000).toFixed(1) + 'M';
                            }

                scales: {

                        grid: { color: 'rgba(255,255,255,0.05)' }

        // ===== ۳. نمودار RSI =====
        const rsiCtx = document.getElementById('modalRSIChart');
        if (modalCharts.rsi) { modalCharts.rsi.destroy(); }
        
        const rsiValues = calculateRSI(data.prices, 14);
        const rsiLabels = data.dates.slice(14);
        
        modalCharts.rsi = new Chart(rsiCtx, {

                        grid: { color: 'rgba(255,255,255,0.05)' }

                }

        });
        
        // خطوط RSI روی کانوس
        setTimeout(() => {

            if (chartArea) {

                ctx2d.strokeStyle = '#ff6b6b';
                ctx2d.setLineDash([5, 5]);

                const y30 = chartArea.top + (chartArea.bottom - chartArea.top) * 0.7;
                ctx2d.moveTo(chartArea.left, y70);
                ctx2d.lineTo(chartArea.right, y70);
                ctx2d.stroke();
                ctx2d.beginPath();
                ctx2d.moveTo(chartArea.left, y30);
                ctx2d.lineTo(chartArea.right, y30);
                ctx2d.stroke();
                ctx2d.restore();
            }
        }, 200);

    function analyzeMarket(marketData, marketName) {
        if(!marketData || marketData.length === 0) {
            return { 
                score: 0, 
                verdict: currentLang === 'en' ? "No Data" : "داده‌ای وجود ندارد", 
                confidence: currentLang === 'en' ? "Low" : "پایین", 
                recommendation: currentLang === 'en' ? "⚪ No Data" : "⚪ بدون داده", 
                emoji: "❓", 
                details: { avgChange: "0", greenPercent: "0", totalVolume: "0", greens: 0, reds: 0 } 
            };
        }
        
        const totalChange = marketData.reduce((sum, item) => sum + item.change, 0);
        const avgChange = totalChange / marketData.length;
        const greens = marketData.filter(item => item.change > 0).length;
        const reds = marketData.filter(item => item.change < 0).length;
        const greenPercent = (greens / marketData.length) * 100;
        const totalVolume = marketData.reduce((sum, item) => sum + (parseFloat(item.volume) || 0), 0);
        
        let score = 0;
        if (avgChange > 0.5) score += 40;
        else if (avgChange > 0) score += 20;
        else if (avgChange < -0.5) score -= 40;
        else if (avgChange < 0) score -= 20;
        
        if (greenPercent > 60) score += 35;
        else if (greenPercent > 50) score += 17;
        else if (greenPercent < 40) score -= 35;
        else if (greenPercent < 50) score -= 17;
        
        if (totalVolume > 100) score += 25;
        else if (totalVolume > 50) score += 12;
        else if (totalVolume < 20) score -= 12;
        else if (totalVolume < 10) score -= 25;
        
        score = Math.min(100, Math.max(-100, score));
        
        let verdictKey, confidence, recommendation, emoji;
        if (score >= 60) { 
            verdictKey = 'strongUp'; 
            confidence = currentLang === 'en' ? "High" : "بالا"; 
            recommendation = currentLang === 'en' ? "🟢 Buy/Hold" : "🟢 خرید/نگهداری"; 
            emoji = "🚀🔥"; 
        } else if (score >= 30) { 
            verdictKey = 'mildUp'; 
            confidence = currentLang === 'en' ? "Medium" : "متوسط"; 
            recommendation = currentLang === 'en' ? "🟡 Mild Buy" : "🟡 خرید ملایم"; 
            emoji = "📈"; 
        } else if (score >= 10) { 
            verdictKey = 'weakUp'; 
            confidence = currentLang === 'en' ? "Low" : "پایین"; 
            recommendation = currentLang === 'en' ? "⚪ Caution" : "⚪ احتیاط/تثبیت"; 
            emoji = "➡️"; 
        } else if (score >= -10) { 
            verdictKey = 'neutral'; 
            confidence = currentLang === 'en' ? "Unknown" : "نامشخص"; 
            recommendation = currentLang === 'en' ? "⚪ Wait" : "⚪ صبر کن"; 
            emoji = "❓"; 
        } else if (score >= -30) { 
            verdictKey = 'weakDown'; 
            confidence = currentLang === 'en' ? "Low" : "پایین"; 
            recommendation = currentLang === 'en' ? "🟡 Caution" : "🟡 احتیاط در خرید"; 
            emoji = "📉"; 
        } else if (score >= -60) { 
            verdictKey = 'mildDown'; 
            confidence = currentLang === 'en' ? "Medium" : "متوسط"; 
            recommendation = currentLang === 'en' ? "🔴 Sell" : "🔴 فروش/خروج"; 
            emoji = "⚠️"; 
        } else { 
            verdictKey = 'strongDown'; 
            confidence = currentLang === 'en' ? "High" : "بالا"; 
            recommendation = currentLang === 'en' ? "🔴 Urgent Sell" : "🔴 فروش فوری"; 
            emoji = "💀🔥"; 
        }
        
        return { 
            score, 
            verdict: getText('analysisStatus.' + verdictKey),
            confidence, 
            recommendation, 
            emoji, 
            details: { 
                avgChange: avgChange.toFixed(2), 
                greenPercent: greenPercent.toFixed(1), 
                totalVolume: totalVolume.toFixed(1), 
                greens, 
                reds 
            } 
        };
    }

    function getSuggestion(item) {
        let score = 0, reasons = [];
        
        if (item.change > 2) { score += 40; reasons.push(currentLang === 'en' ? "✅ Good price growth" : "✅ رشد قیمتی خوب"); }
        else if (item.change > 0.5) { score += 20; reasons.push(currentLang === 'en' ? "✅ Mild growth" : "✅ رشد ملایم"); }
        else if (item.change < -2) { score -= 40; reasons.push(currentLang === 'en' ? "❌ Sharp drop" : "❌ ریزش شدید قیمت"); }
        else if (item.change < -0.5) { score -= 20; reasons.push(currentLang === 'en' ? "❌ Mild drop" : "❌ ریزش ملایم"); }
        else { reasons.push(currentLang === 'en' ? "⚪ Consolidation" : "⚪ قیمت در حال تثبیت"); }
        
        const pred = item.pred || 0;
        if (pred > 1.5) { score += 30; reasons.push(currentLang === 'en' ? "🔮 Strong up prediction" : "🔮 پیش‌بینی صعود قوی"); }
        else if (pred > 0.5) { score += 15; reasons.push(currentLang === 'en' ? "🔮 Mild up prediction" : "🔮 پیش‌بینی صعود ملایم"); }
        else if (pred < -1.5) { score -= 30; reasons.push(currentLang === 'en' ? "📉 Strong down prediction" : "📉 پیش‌بینی نزول شدید"); }
        else if (pred < -0.5) { score -= 15; reasons.push(currentLang === 'en' ? "📉 Mild down prediction" : "📉 پیش‌بینی نزول ملایم"); }
        else { reasons.push(currentLang === 'en' ? "⚖️ Neutral prediction" : "⚖️ پیش‌بینی خنثی"); }
        
        const vol = parseFloat(item.volume) || 0;
        if (vol > 20) { score += 15; reasons.push(currentLang === 'en' ? "📊 High volume" : "📊 حجم معاملات بالا"); }
        else if (vol > 10) { score += 8; reasons.push(currentLang === 'en' ? "📊 Medium volume" : "📊 حجم معاملات متوسط"); }
        else if (vol < 5) { score -= 8; reasons.push(currentLang === 'en' ? "⚠️ Low volume" : "⚠️ حجم معاملات پایین"); }
        
        if (item.pe && item.pe < 8) { score += 15; reasons.push(currentLang === 'en' ? "💎 Attractive P/E" : "💎 نسبت P/E جذاب"); }
        else if (item.pe && item.pe > 12) { score -= 10; reasons.push(currentLang === 'en' ? "⚠️ High P/E" : "⚠️ نسبت P/E بالا"); }
        
        let suggestionKey, suggestionClass, emoji;
        if (score >= 40) { suggestionKey = 'strongBuy'; suggestionClass = "suggestion-buy"; emoji = "🚀"; }
        else if (score >= 15) { suggestionKey = 'mildBuy'; suggestionClass = "suggestion-buy"; emoji = "📈"; }
        else if (score >= -10) { suggestionKey = 'hold'; suggestionClass = "suggestion-hold"; emoji = "⏳"; }
        else if (score >= -35) { suggestionKey = 'sell'; suggestionClass = "suggestion-sell"; emoji = "⚠️"; }
        else { suggestionKey = 'urgentSell'; suggestionClass = "suggestion-sell"; emoji = "💀"; }
        
        return { 
            suggestion: currentLang === 'en' ? getText('suggestion.' + suggestionKey) : "🟢 " + getText('suggestion.' + suggestionKey),
            suggestionClass, 
            emoji, 
            score, 
            reasons 
        };
    }

                <div><div style="color:#8e9aaf;">${lowLabel}</div><div><strong>${formatPrice(item.low)}</strong></div></div>
                <div><div style="color:#8e9aaf;">${volumeLabel}</div><div><strong>${item.volume}</strong></div></div>
                ${item.eps ? `<div><div style="color:#8e9aaf;">${epsLabel}</div><div><strong>${item.eps}</strong></div></div>` : ''}
                ${item.pe ? `<div><div style="color:#8e9aaf;">${peLabel}</div><div><strong>${item.pe}</strong></div></div>` : ''}
            </div>`;
        }
        document.getElementById('modalBody').innerHTML = bodyHtml;
        
        showSuggestion(item);
        
        setTimeout(() => {
            renderModalCharts(item);
            const pred = item.pred || 0;
            document.getElementById('chartPrediction').innerHTML = `📊 ${getText('prediction')}: ${getPredictionText(pred)}`;
        }, 100);
        
        modal.classList.add('active');
    }

    function closeModal() {
        document.getElementById('modal').classList.remove('active');
        Object.keys(modalCharts).forEach(key => {
            if (modalCharts[key]) { modalCharts[key].destroy(); delete modalCharts[key]; }
        });
        modalCharts = {};
    }

    function getMarketStats(marketData) {
        const total = marketData.length, greens = marketData.filter(i => i.change > 0).length, reds = marketData.filter(i => i.change < 0).length;
        const avgChange = (marketData.reduce((s,i) => s + i.change, 0) / total).toFixed(1);
        const greenPercent = (greens / total * 100).toFixed(0);
        return { total, greens, reds, avgChange, greenPercent };
    }

    function renderOverview() {
        const grid = document.getElementById("cardGrid");
        if(!grid) return;
        const overviewTitle = getText('overview.title');
        const totalLabel = getText('overview.total');
        const greenLabel = currentLang === 'en' ? "Green" : "🟢 سبز";
        const redLabel = currentLang === 'en' ? "Red" : "🔴 قرمز";
        const avgLabel = currentLang === 'en' ? "Avg" : "میانگین";
        const marketsList = [
            { name: currentLang === 'en' ? "🪙 Crypto" : "🪙 رمزارزها", icon: "₿", color: "#f7931a", stats: getMarketStats(cryptoData), key: "crypto" },
            { name: currentLang === 'en' ? "🇮🇷 Stocks" : "🇮🇷 بورس ایران", icon: "🏛️", color: "#3498db", stats: getMarketStats(stockData), key: "stock" },
            { name: currentLang === 'en' ? "🥇 Metals" : "🥇 فلزات", icon: "🥇", color: "#fbb034", stats: getMarketStats(metalsData), key: "metals" },
            { name: currentLang === 'en' ? "💱 Forex" : "💱 ارزها", icon: "💵", color: "#2ecc71", stats: getMarketStats(currencyData), key: "currency" },
            { name: currentLang === 'en' ? "🛢️ Energy" : "🛢️ انرژی", icon: "🛢️", color: "#e67e22", stats: getMarketStats(energyData), key: "energy" },
            { name: currentLang === 'en' ? "🇺🇸 US Stocks" : "🇺🇸 سهام آمریکا", icon: "📊", color: "#4285f4", stats: getMarketStats(usStocksData), key: "us_stocks" }
        ];
        let html = `<div style="margin-bottom: 1rem;"><h2 style="color: #f6b93b;">${overviewTitle}</h2></div><div class="markets-overview">`;
        for(const market of marketsList) {
            const fillColor = market.stats.greenPercent > 50 ? "#2ed573" : "#ff6b6b";
            const analysis = market.stats.greenPercent > 60 ? (currentLang === 'en' ? "🔥 Strong Up" : "🔥 صعود قوی") : 
                            market.stats.greenPercent > 50 ? (currentLang === 'en' ? "📈 Mild Up" : "📈 صعود ملایم") : 
                            market.stats.greenPercent > 40 ? (currentLang === 'en' ? "⚖️ Neutral" : "⚖️ متعادل") : 
                            (currentLang === 'en' ? "📉 Down" : "📉 نزولی");
            html += `<div class="market-card" onclick="switchToMarket('${market.key}')">
                <div class="market-header"><div class="market-icon">${market.icon}</div><div class="market-title">${market.name}</div></div>
                <div class="market-stats">
                    <div class="market-stat"><div class="market-stat-label">${totalLabel}</div><div class="market-stat-value">${market.stats.total}</div></div>
                    <div class="market-stat"><div class="market-stat-label">${greenLabel}</div><div class="market-stat-value positive">${market.stats.greens}</div></div>
                    <div class="market-stat"><div class="market-stat-label">${redLabel}</div><div class="market-stat-value negative">${market.stats.reds}</div></div>
                    <div class="market-stat"><div class="market-stat-label">${avgLabel}</div><div class="market-stat-value ${market.stats.avgChange>=0?'positive':'negative'}">${market.stats.avgChange>=0?'+':''}${market.stats.avgChange}%</div></div>
                </div>
                <div class="market-progress"><div class="market-progress-fill" style="width: ${market.stats.greenPercent}%; background: ${fillColor}"></div></div>
                <div class="market-analysis">${analysis} | ${market.stats.greenPercent}% Green</div>
            </div>`;
        }
        html += `</div>`;
        grid.innerHTML = html;
    }

    function switchToMarket(market) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`.tab-btn[data-market="${market}"]`)?.classList.add('active');
        currentMarket = market;
        currentFilter = "all";
        searchText = "";
        document.getElementById('searchInput').value = "";
        document.querySelectorAll('.filter-btn').forEach(f => f.classList.remove('active'));
        document.querySelector('.filter-btn[data-filter="all"]')?.classList.add('active');
        const filterBar = document.getElementById('filterBar');
        if(currentMarket === "overview") filterBar.style.display = "none";
        else filterBar.style.display = "flex";
        Object.keys(chartInstances).forEach(key => {
            try { chartInstances[key].destroy(); } catch(e) {}
            delete chartInstances[key];
        });
        renderCards();
    }

    function renderCards() {
        if(currentMarket === "overview") { renderOverview(); updateStatsBar(); return; }
        
        const grid = document.getElementById("cardGrid");
        if(!grid) return;
        
        let data = [...getCurrentData()];
        if(currentFilter === "gainers") data = data.filter(i => i.change > 0);
        else if(currentFilter === "losers") data = data.filter(i => i.change < 0);
        
        if(searchText.trim() !== "") {
            const q = searchText.trim().toLowerCase();
            data = data.filter(i => i.name.toLowerCase().includes(q) || i.symbol.toLowerCase().includes(q));
        }
        
        if(data.length === 0) { grid.innerHTML = '<div style="text-align:center;padding:1.5rem">🔍 Not found</div>'; updateStatsBar(); return; }
        
        const priceLabel = getText('price'), changeLabel = getText('change'), highLabel = getText('high'), lowLabel = getText('low'), volumeLabel = getText('volume');
        const marketCapLabel = getText('marketCap'), epsLabel = getText('eps'), peLabel = getText('pe');
        
        let html = '';
        for(const item of data) {
            const chClass = item.change >= 0 ? 'positive' : 'negative';
            const chSign = (item.change >= 0 ? '+' : '') + item.change.toFixed(2) + '%';
            const predText = getPredictionText(item.pred);
            const translatedName = translateName(item.name);
            let priceStr = '', detailsStr = '';
            
            if(item.unit) {
                priceStr = `${formatPrice(item.price)} ${item.unit}`;
                detailsStr = `<div><span style="color:#8e9aaf;">${highLabel}:</span> ${formatPrice(item.high)}</div><div><span style="color:#8e9aaf;">${lowLabel}:</span> ${formatPrice(item.low)}</div><div><span style="color:#8e9aaf;">${volumeLabel}:</span> ${item.volume}</div>`;
            } else if(currentMarket === "crypto" || currentMarket === "us_stocks") {
                const currencySymbol = currentMarket === "crypto" ? "$" : "$";
                priceStr = `${currencySymbol}${formatPrice(item.price)}`;
                detailsStr = `<div><span style="color:#8e9aaf;">${highLabel}:</span> ${formatPrice(item.high)}</div><div><span style="color:#8e9aaf;">${lowLabel}:</span> ${formatPrice(item.low)}</div><div><span style="color:#8e9aaf;">${marketCapLabel}:</span> ${item.marketCap}</div><div><span style="color:#8e9aaf;">${volumeLabel}:</span> ${item.volume}</div>`;
            } else {
                priceStr = `${formatPrice(item.price)}`;
                detailsStr = `<div><span style="color:#8e9aaf;">${highLabel}:</span> ${formatPrice(item.high)}</div><div><span style="color:#8e9aaf;">${lowLabel}:</span> ${formatPrice(item.low)}</div><div><span style="color:#8e9aaf;">${volumeLabel}:</span> ${item.volume}</div>${item.eps ? `<div><span style="color:#8e9aaf;">${epsLabel}:</span> ${item.eps}</div>` : ''}${item.pe ? `<div><span style="color:#8e9aaf;">${peLabel}:</span> ${item.pe}</div>` : ''}`;
            }
            
            const chartId = `chart-${item.id}`;
            html += `<div class="card" onclick="showDetails(${item.id})">
                <div class="card-header">
                    <div class="item-info">
                        <div class="item-icon" style="background:${item.color}20;border:2px solid ${item.color}"><span>${item.icon}</span></div>
                        <div class="item-name"><h3>${translatedName}</h3><div class="item-symbol">${item.symbol}</div></div>
                    </div>
                    <div class="price-section">
                        <div class="price">${priceStr}</div>
                        <div class="change ${chClass}">${chSign}</div>
                    </div>
                </div>
                <div class="chart-container"><canvas id="${chartId}"></canvas></div>
                <div class="details">${detailsStr}</div>
                <div class="prediction ${chClass}">${predText}</div>
            </div>`;
        }
        grid.innerHTML = html;
        
        setTimeout(() => {
            data.forEach(item => {
                const chartId = `chart-${item.id}`;
                renderCardChart(chartId, item);
            });
        }, 150);
        
        updateStatsBar();
    }

    function updateStatsBar() {
        const statsBar = document.getElementById('statsBar');
        const totalLabel = getText('stats.total'), greenLabel = getText('stats.green'), redLabel = getText('stats.red');
        const analysisLabel = getText('stats.analysis'), analyzeLabel = getText('stats.analyze');
        if(currentMarket === "overview") {
            const totalSymbols = cryptoData.length + stockData.length + metalsData.length + currencyData.length + energyData.length + usStocksData.length;
            statsBar.innerHTML = `<div class="stat-item" onclick="showAnalysis()" style="cursor:pointer;"><div class="stat-label">${analysisLabel}</div><div class="stat-value" style="color:#f6b93b;">${analyzeLabel}</div></div>
                <div class="stat-item"><div class="stat-label">${getText('overview.total')}</div><div class="stat-value">${totalSymbols}</div></div>`;
        } else {
            const data = getCurrentData();
            const greens = data.filter(i => i.change > 0).length;
            const reds = data.filter(i => i.change < 0).length;
            statsBar.innerHTML = `<div class="stat-item"><div class="stat-label">${totalLabel}</div><div class="stat-value">${data.length}</div></div>
                <div class="stat-item"><div class="stat-label">${greenLabel}</div><div class="stat-value positive">${greens}</div></div>
                <div class="stat-item"><div class="stat-label">${redLabel}</div><div class="stat-value negative">${reds}</div></div>
                <div class="stat-item" onclick="showAnalysis()" style="cursor:pointer;"><div class="stat-label">${analysisLabel}</div><div class="stat-value" style="color:#f6b93b;">${analyzeLabel}</div></div>`;
        }
    }

    function setupEventListeners() {
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMarket = btn.getAttribute('data-market');
                currentFilter = "all";
                searchText = "";
                document.getElementById('searchInput').value = "";
                document.querySelectorAll('.filter-btn').forEach(f => f.classList.remove('active'));
                document.querySelector('.filter-btn[data-filter="all"]').classList.add('active');
                const filterBar = document.getElementById('filterBar');
                if(currentMarket === "overview") filterBar.style.display = "none";
                else filterBar.style.display = "flex";
                Object.keys(chartInstances).forEach(key => {
                    try { chartInstances[key].destroy(); } catch(e) {}
                    delete chartInstances[key];
                });
                renderCards();
            });
        });
        
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if(currentMarket === "overview") return;
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.getAttribute('data-filter');
                renderCards();
            });
        });
        
        document.getElementById('searchInput').addEventListener('input', (e) => {
            if(currentMarket === "overview") return;
            searchText = e.target.value;
            renderCards();
        });
    }

    function initTheme() {
        const savedTheme = localStorage.getItem('marketTheme');
        if (savedTheme === 'light') {
            document.body.classList.add('light');
            document.getElementById('themeBtn').innerHTML = '☀️ Day Mode';
        } else {
            document.body.classList.remove('light');
            document.getElementById('themeBtn').innerHTML = '🌙 Night Mode';
        }
    }

    document.getElementById('themeBtn').addEventListener('click', () => {
        document.body.classList.toggle('light');
        if (document.body.classList.contains('light')) {
            document.getElementById('themeBtn').innerHTML = '☀️ Day Mode';
            localStorage.setItem('marketTheme', 'light');
        } else {
            document.getElementById('themeBtn').innerHTML = '🌙 Night Mode';
            localStorage.setItem('marketTheme', 'dark');
        }
    });

    function initLanguage() {
        const savedLang = localStorage.getItem('marketLang') || 'fa';
        currentLang = savedLang;
        if (currentLang === 'en') {
            document.getElementById('langBtn').innerHTML = '🇮🇷 فارسی';
        } else {
            document.getElementById('langBtn').innerHTML = '🇬🇧 English';
        }
        updateLanguage();
    }

    document.getElementById('langBtn').addEventListener('click', () => {
        currentLang = currentLang === 'fa' ? 'en' : 'fa';
        if (currentLang === 'en') {
            document.getElementById('langBtn').innerHTML = '🇮🇷 فارسی';
        } else {
            document.getElementById('langBtn').innerHTML = '🇬🇧 English';
        }
        localStorage.setItem('marketLang', currentLang);
        updateLanguage();
        renderCards();
    });

// ==================== بروزرسانی قیمت‌ها با APIهای جدید ====================
async function fetchLivePrices() {
    try {
        // ۱. دریافت قیمت دلار به تومان از zipodo
        let usdToIRR = 192500; // مقدار پیش‌فرض
        try {
            const zipodoRes = await fetch('https://api.zipodo.ir/usdt/');
            if (zipodoRes.ok) {
                const zipodoData = await zipodoRes.json();
                if (zipodoData.price) {
                    usdToIRR = zipodoData.price;
                    console.log('✅ قیمت دلار از zipodo:', usdToIRR);
                }
            }
        } catch(e) {
            console.log('❌ خطا در دریافت دلار از zipodo:', e);
        }
        
        // ۲. دریافت نرخ ارزها به دلار از exchangerate-api
        let rates = {};
        try {
            const fxRes = await fetch(`https://v6.exchangerate-api.com/v6/${EXCHANGE_RATE_API_KEY}/latest/USD`);
            if (fxRes.ok) {
                const fxData = await fxRes.json();
                if (fxData.result === 'success' && fxData.conversion_rates) {
                    rates = fxData.conversion_rates;
                    console.log('✅ نرخ ارزها دریافت شد');
                }
            }
        } catch(e) {
            console.log('❌ خطا در دریافت نرخ ارزها:', e);
        }
        
        // ۳. بروزرسانی ارزهای فیات
        if (Object.keys(rates).length > 0) {
            currencyData.forEach(item => {
                if (rates[item.symbol]) {
                    const rateInUSD = rates[item.symbol];
                    const newPrice = rateInUSD * usdToIRR;
                    const change = ((newPrice - item.price) / item.price) * 100;
                    
                    item.price = Math.round(newPrice);
                    item.change = parseFloat(change.toFixed(2));
                    item.pred = item.change * 0.8;
                    item.high = Math.round(item.price * 1.008);
                    item.low = Math.round(item.price * 0.92);
                }
            });
        }
        
        // ۴. بروزرسانی رمزارزها از CoinGecko
        try {
            const cryptoRes = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=20&page=1&sparkline=false');
            if (cryptoRes.ok) {
                const cryptoApi = await cryptoRes.json();
                cryptoData.forEach((item, idx) => {
                    if (cryptoApi[idx]) {
                        item.price = cryptoApi[idx].current_price;
                        item.change = cryptoApi[idx].price_change_percentage_24h || 0;
                        item.pred = item.change * 0.8;
                        item.high = parseFloat((item.price * 1.02).toFixed(4));
                        item.low = parseFloat((item.price * 0.98).toFixed(4));
                    }
                });
            }
        } catch(e) {
            console.log('❌ خطا در دریافت رمزارزها:', e);
        }
        
        // ۵. بروزرسانی فلزات (شبیه‌سازی)
        metalsData.forEach(item => {
            const ch = (Math.random() - 0.48) * 1.8;
            item.price = Math.round(item.price * (1 + ch / 100));
            item.change = ch;
            item.pred = ch * 0.8;
            item.high = Math.round(item.price * 1.008);
            item.low = Math.round(item.price * 0.992);
        });
        
        // ۶. بروزرسانی انرژی (شبیه‌سازی)
        energyData.forEach(item => {
            const ch = (Math.random() - 0.48) * 2.2;
            item.price = parseFloat((item.price * (1 + ch / 100)).toFixed(2));
            item.change = ch;
            item.pred = ch * 0.8;
            item.high = parseFloat((item.price * 1.008).toFixed(2));
            item.low = parseFloat((item.price * 0.992).toFixed(2));
        });
        
        // ۷. بروزرسانی سهام آمریکا (شبیه‌سازی)
        usStocksData.forEach(item => {
            const ch = (Math.random() - 0.48) * 1.6;
            item.price = parseFloat((item.price * (1 + ch / 100)).toFixed(2));
            item.change = ch;
            item.pred = ch * 0.8;
            item.high = parseFloat((item.price * 1.008).toFixed(2));
            item.low = parseFloat((item.price * 0.992).toFixed(2));
        });
        
        // ۸. بروزرسانی بورس ایران (شبیه‌سازی)
        stockData.forEach(item => {
            const ch = (Math.random() - 0.48) * 2.5;
            item.price = Math.round(item.price * (1 + ch / 100));
            item.change = ch;
            item.pred = ch * 0.8;
            item.high = Math.round(item.price * 1.008);
            item.low = Math.round(item.price * 0.992);
        });
        
        document.getElementById('statusBadge').innerHTML = 'LIVE';
        document.getElementById('statusBadge').style.background = '#ff4444';
        document.getElementById('lastUpdate').innerHTML = `✅ ${new Date().toLocaleTimeString('fa-IR')} | دلار: ${usdToIRR.toLocaleString()}`;
    } catch(e) {
        document.getElementById('statusBadge').innerHTML = 'Offline';
        document.getElementById('statusBadge').style.background = '#f6b93b';
        document.getElementById('lastUpdate').innerHTML = `📡 ${new Date().toLocaleTimeString('fa-IR')} (Offline)`;
        simulateUpdate();
    }
    if (currentMarket !== "overview") renderCards(); else renderOverview();
    updateStatsBar();
}
function simulateUpdate() {
    const allData = [...cryptoData, ...stockData, ...metalsData, ...currencyData, ...energyData, ...usStocksData];
    for (let item of allData) {
        let ch = (Math.random() - 0.5) * 2; // نوسان کمتر برای ارزها
        
        // برای ارزها نوسان کمتر (حدود ۰.۵٪)
        if (item.unit === "تومان") {
            ch = (Math.random() - 0.5) * 1;
        }
        
        if (typeof item.price === 'number') {
            if (item.unit && item.unit.includes('دلار')) {
                item.price = parseFloat((item.price * (1 + ch / 100)).toFixed(2));
            } else {
                item.price = Math.round(item.price * (1 + ch / 100));
            }
        }
        item.change = ch;
        item.pred = ch * 0.8;
        if(item.high) {
            if (typeof item.high === 'number') {
                if (item.unit && item.unit.includes('دلار')) {
                    item.high = parseFloat((item.price * 1.008).toFixed(2));
                    item.low = parseFloat((item.price * 0.992).toFixed(2));
                } else {
                    item.high = Math.round(item.price * 1.008);
                    item.low = Math.round(item.price * 0.992);
                }
            }
        }
    }
    if (currentMarket !== "overview") renderCards(); else renderOverview();
    updateStatsBar();
}

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        const installBtn = document.getElementById('installAppBtn');
        if (installBtn) installBtn.style.display = 'inline-block';
    });

    document.getElementById('installAppBtn').addEventListener('click', () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then(() => {
                deferredPrompt = null;
                document.getElementById('installAppBtn').style.display = 'none';
            });
        }
    });

    document.getElementById('modal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeModal();
    });

    initTheme();
    initLanguage();
    renderCards();
    setupEventListeners();
    fetchLivePrices();
    setInterval(fetchLivePrices, 60000);
    setInterval(simulateUpdate, 15000);
